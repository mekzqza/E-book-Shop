<!doctype html>
<meta charset="utf-8">
<title>E-book Shop check</title>
<!-- Walks the whole flow in an iframe. Serve over http (python -m http.server) and open /check.html. -->
<pre id="out">running…</pre>
<iframe id="f" src="index.html" width="390" height="844"></iframe>
<script>
const f = document.getElementById('f'), out = document.getElementById('out');
const tick = () => new Promise(r => setTimeout(r, 50));
const w = () => f.contentWindow, $ = s => w().document.querySelector(s);
const fill = (sel, v) => { $(sel).value = v; };
const submit = async () => { $('form .bar .btn').click(); await tick(); };
const assert = (ok, msg) => { if (!ok) throw new Error(msg); };

f.onload = async () => {
  try {
    w().localStorage.clear();
    w().location.hash = '#/book/2'; await tick();
    await submit();
    assert(w().location.hash === '#/book/2', 'empty buyer form must not advance');
    fill('[name=name]', 'สมชาย <b>x</b>'); fill('[name=email]', 'Buyer@Example.com'); await submit();
    assert($('dl').textContent.includes('สมชาย <b>x</b>'), 'summary shows escaped name');
    await submit();
    const no = w().location.hash.split('/')[2];
    assert(/^EB-\d{4}-0001$/.test(no) && $('.badge').textContent === 'PENDING', 'order created PENDING');
    await submit();
    assert($('.badge').textContent === 'PAID' && $('.order-no').textContent === no, 'paid → success');
    $('[data-act=track]').click(); await tick();
    assert(!$('[data-act=download]').disabled, 'tracking from success shows downloadable result');
    $('[data-act=reset]').click(); await tick();
    assert($('[name=no]').value === '' && $('form:invalid'), 'new search clears fields, button guarded');
    fill('[name=no]', no); fill('[name=email]', 'wrong@example.com'); await submit();
    assert($('.alert') && !$('.dl'), 'email mismatch → error, no order leaked');
    fill('[name=no]', no.toLowerCase()); fill('[name=email]', ' buyer@example.com '); await submit();
    assert($('.dl') && $('h1').textContent === 'ผลการค้นหา', 'case/space-insensitive match → result');
    out.textContent = 'PASS';
  } catch (e) { out.textContent = 'FAIL: ' + e.message + ' @ ' + w().location.hash; }
};
</script>
