<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>E-book Shop</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--muted:#6b6b6b;--faint:#8a877f;--line:#dcdad5;--dash:#b8b5ae;--soft:#fbfaf8;--err:#b04a2a;--mono:ui-monospace,"Courier New",monospace}
html{background:#f0eee9}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Noto Sans Thai","Leelawadee UI",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,dl,dd{margin:0}
a{color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#fff;display:flex;flex-direction:column}
.fill{flex:1;display:flex;flex-direction:column}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.center{align-items:center;text-align:center}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--faint)}
.mono{font-family:var(--mono)}

.top{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:4px;padding:4px 12px 4px 4px;background:#fff;border-bottom:1.5px solid var(--ink)}
.top h1{font-size:16px;font-weight:600}
.back{width:44px;height:44px;display:grid;place-items:center;font-size:28px;line-height:1;text-decoration:none}
.shop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1.5px solid var(--ink)}
.shop h1{font-size:19px}
.shop p{font-size:12px;color:var(--muted)}
.shop a,.foot a{font-size:14px;white-space:nowrap;padding:8px 0}
.head{display:flex;justify-content:space-between;align-items:baseline}
.head h2{font-size:16px;font-weight:600}

.book{display:flex;gap:12px;padding-top:14px;border-top:1px dashed var(--line)}
.cover{width:110px;aspect-ratio:110/148;flex:none;display:flex;align-items:flex-end;padding:10px;border-radius:4px;color:#fff;font-size:13px;font-weight:600;line-height:1.3;background:linear-gradient(160deg,hsl(var(--h) 40% 46%),hsl(var(--h) 45% 24%));box-shadow:inset 6px 0 rgb(0 0 0/.18)}
.cover.big{width:150px;padding:14px;font-size:17px;align-self:center}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.info h3{font-size:15px;line-height:1.35}
.info p{font-size:13px}
.buy{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-size:17px;font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:0 16px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:#fff;font:inherit;font-size:17px;text-decoration:none;cursor:pointer}
.btn.sm{width:auto;min-width:76px;min-height:40px;font-size:15px}
.btn.outline{background:#fff;color:var(--ink)}
.btn.dashed{background:none;color:var(--muted);border-style:dashed;border-color:var(--dash)}
.btn:disabled,.guard:invalid .bar .btn{background:#f2f0ec;color:#a8a59e;border:2px dashed #c9c7c2;pointer-events:none}
.bar{position:sticky;bottom:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px;background:var(--soft);border-top:1.5px solid var(--ink)}
.foot{position:static;background:#fff;align-items:flex-start;padding-block:6px}

.form{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1.5px solid var(--ink)}
.form h2{font-size:16px;font-weight:600}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
label small{font-size:12px}
input{height:48px;padding:0 12px;border:1.5px solid var(--dash);border-radius:8px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
input:focus{outline:2px solid var(--ink);outline-offset:1px}
input:user-invalid,.err input{border:2px solid var(--err)}
.req{color:var(--err);font-weight:400}
.bad{color:var(--err)}

.card{border:1.5px solid var(--ink);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.rows{display:flex;flex-direction:column;gap:12px}
.rows>div{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rows>div+div,.card>.dl{padding-top:12px;border-top:1px dashed var(--line)}
.rows dt{flex:none;font-size:13px;color:var(--muted)}
.rows dd{min-width:0;text-align:right;overflow-wrap:anywhere}
.dl{display:flex;flex-direction:column;gap:7px}
.badge{display:inline-block;padding:4px 12px;border:1.5px solid;border-radius:999px;font:13px/1.2 var(--mono);letter-spacing:.06em}
.PENDING{background:#fbe3b4;border-color:#d99b22;color:#7a4e00}
.PAID{background:#cfeec4;border-color:#5d9e4c;color:#2b5c1f}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1.5px dashed var(--dash);border-radius:10px}
.total .price{font-size:24px}

.demo{padding:14px 16px;background:#fbe3b4;border-bottom:3px solid #d99b22;text-align:center;font-size:13px;color:#5e3a00}
.demo strong{display:inline-block;margin-bottom:8px;padding:8px 16px;border:2.5px solid #8a5a00;border-radius:8px;background:#f7cd77;color:#6b4200;font:20px/1 var(--mono);letter-spacing:.1em}
.methods{display:flex;flex-direction:column;gap:9px}
.method{flex-direction:row;align-items:center;gap:12px;padding:14px;border:1.5px dashed #c9c7c2;border-radius:9px;background:#f7f6f3;color:#a8a59e}
.method input{height:auto;margin:0}
.qr{height:140px;display:grid;place-items:center;border:1.5px dashed #c9c7c2;border-radius:9px;background:repeating-conic-gradient(#e7e5df 0 25%,#f7f6f3 0 50%) 0 0/16px 16px}
.qr span{padding:6px 10px;background:#fff;font:12px/1.4 var(--mono);color:var(--muted)}

.check{width:92px;height:92px;margin-top:12px;display:grid;place-items:center;border:2.5px solid #5d9e4c;border-radius:50%;background:#cfeec4;color:#2b5c1f;font-size:44px}
.success h1{font-size:22px}
.success .card{width:100%;align-items:center}
.order-no{font:26px/1.1 var(--mono)}
.note{display:flex;flex-direction:column;gap:6px;width:100%;padding:14px;border:1.5px dashed var(--dash);border-radius:10px;background:var(--soft);font-size:13px;text-align:left}
.note.row{flex-direction:row;gap:10px}
.alert{display:flex;gap:10px;padding:14px;border:2px solid var(--err);border-radius:10px;background:#f7e2da;color:#7d2f14;font-size:13px}
.alert strong{display:block;font-size:16px;font-weight:600}
.empty{height:150px;display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:10px;color:#a8a59e;font-size:13px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:9;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" hidden></div>
<script>
const SHOP = { name: 'ร้านอีบุ๊ก', tagline: 'อ่านได้ทันทีหลังชำระเงิน', contact: 'mailto:support@example.com' };

// sample catalog, replace with the real books
const BOOKS = [
  { id: '1', title: 'ศิลปะแห่งการใช้ชีวิตช้าๆ', author: 'ปริญญา ใจดี', price: 129, hue: 200,
    blurb: 'ชวนหยุดพัก หายใจ และกลับมาใส่ใจสิ่งเล็กๆ รอบตัว',
    desc: 'หนังสือที่พาคุณออกจากชีวิตที่เร่งรีบ ผ่านเรื่องเล่าและแบบฝึกหัดสั้นๆ ที่ทำได้ทุกวัน ตั้งแต่การจิบกาแฟอย่างตั้งใจ ไปจนถึงการจัดตารางชีวิตให้มีที่ว่างสำหรับตัวเอง' },
  { id: '2', title: 'ทำอาหารง่ายๆ ในหอพัก', author: 'มาลี สุขสันต์', price: 89, hue: 25,
    blurb: '50 เมนูด้วยหม้อหุงข้าวและไมโครเวฟ',
    desc: 'รวมสูตรอาหารราคาประหยัดสำหรับคนมีครัวเล็ก ใช้อุปกรณ์แค่หม้อหุงข้าวและไมโครเวฟ พร้อมเทคนิคจ่ายตลาดรายสัปดาห์และเก็บวัตถุดิบให้อยู่ได้นาน' },
  { id: '3', title: 'เริ่มต้นลงทุนฉบับมือใหม่', author: 'ธนา มั่งมี', price: 159, hue: 150,
    blurb: 'เข้าใจกองทุน หุ้น และดอกเบี้ยทบต้นแบบไม่ปวดหัว',
    desc: 'อธิบายพื้นฐานการลงทุนด้วยภาษาง่ายๆ ตั้งแต่การตั้งเป้าหมาย การกระจายความเสี่ยง ไปจนถึงการเลือกกองทุนแรก พร้อมตัวอย่างตัวเลขจริงให้ลองคำนวณตาม' },
];

const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const baht = n => '฿' + n;
const book = id => BOOKS.find(b => b.id === id);

// ponytail: orders live in this browser's localStorage, so tracking works on the same device only
// and no email is actually sent. Swap orders()/saveOrder() for a server API when going live.
let mem = {};
const orders = () => { try { return JSON.parse(localStorage.getItem('orders')) || {}; } catch { return mem; } };
function saveOrder(o) {
  mem = { ...orders(), [o.no]: o };
  try { localStorage.setItem('orders', JSON.stringify(mem)); } catch {}
}
function findOrder(no, email) {
  const o = orders()[no.trim().toUpperCase()];
  return o && o.email.toLowerCase() === email.trim().toLowerCase() ? o : null;
}

const draft = { bookId: null, name: '', email: '' };
const track = { no: '', email: '', error: false };

const nav = (title, back) => `<header class="top"><a class="back" href="${back}" aria-label="ย้อนกลับ">‹</a><h1>${title}</h1></header>`;
const badge = s => `<span class="badge ${s}">${s}</span>`;
const cover = (b, big) => `<div class="cover${big ? ' big' : ''}" style="--h:${b.hue}" aria-hidden="true">${b.title}</div>`;

// 01
const storefront = () => `
  <header class="shop"><div><h1>${SHOP.name}</h1><p>${SHOP.tagline}</p></div><a href="#/track">ติดตามคำสั่งซื้อ</a></header>
  <div class="body">
    <div class="head"><h2>หนังสือทั้งหมด</h2><span class="hint">${BOOKS.length} เล่ม</span></div>
    ${BOOKS.map(b => `
    <article class="book">${cover(b)}
      <div class="info">
        <h3>${b.title}</h3><p class="muted">${b.author}</p><p>${b.blurb}</p>
        <div class="buy"><span class="price">${baht(b.price)}</span><a class="btn sm" href="#/book/${b.id}">ซื้อ</a></div>
      </div>
    </article>`).join('')}
  </div>
  <footer class="bar foot"><a href="#/track">ติดตามคำสั่งซื้อ</a></footer>`;

// 02
const detail = b => `${nav('รายละเอียดหนังสือ', '#/')}
  <form id="buyer" class="fill">
    <div class="body">
      ${cover(b, true)}
      <div><h2>${b.title}</h2><p class="muted">${b.author}</p><p class="price" style="font-size:22px">${baht(b.price)}</p></div>
      <p>${b.desc}</p>
      <section class="form">
        <h2>ข้อมูลผู้ซื้อ</h2>
        <input type="hidden" name="bookId" value="${b.id}">
        <label><span>ชื่อ-นามสกุล <b class="req">*</b></span><input name="name" required autocomplete="name" value="${esc(draft.name)}"></label>
        <label><span>อีเมล <b class="req">*</b></span><input name="email" type="email" required autocomplete="email" value="${esc(draft.email)}">
          <small>ลิงก์ดาวน์โหลดจะถูกส่งไปที่อีเมลนี้ · โปรดตรวจสอบให้ถูกต้อง</small></label>
      </section>
    </div>
    <div class="bar"><button class="btn">ดำเนินการต่อ</button></div>
  </form>`;

// 03
const summary = b => `${nav('สรุปคำสั่งซื้อ', '#/book/' + b.id)}
  <form id="confirm" class="fill">
    <div class="body">
      <p class="muted">ตรวจสอบข้อมูลก่อนยืนยันคำสั่งซื้อ</p>
      <dl class="card rows">
        <div><dt>หนังสือ</dt><dd>${b.title}</dd></div>
        <div><dt>ราคา</dt><dd class="price">${baht(b.price)}</dd></div>
        <div><dt>ชื่อผู้ซื้อ</dt><dd>${esc(draft.name)}</dd></div>
        <div><dt>อีเมล</dt><dd>${esc(draft.email)}</dd></div>
      </dl>
      <a href="#/book/${b.id}">แก้ไข</a>
      <div class="total"><span>ยอดชำระ</span><span class="price">${baht(b.price)}</span></div>
      <p class="hint">สินค้าดิจิทัล · ไม่มีค่าจัดส่ง</p>
    </div>
    <div class="bar"><button class="btn">ยืนยันคำสั่งซื้อ</button></div>
  </form>`;

// 04
const pay = o => `
  <div class="demo"><strong>⚠ DEMO ONLY</strong><p>หน้านี้เป็นการชำระเงินจำลองเพื่อการสาธิตเท่านั้น<br>ไม่มีการตัดเงินจริง และไม่มีการเก็บข้อมูลบัตร</p></div>
  <form id="pay" class="fill">
    <input type="hidden" name="no" value="${o.no}">
    <div class="body">
      <dl class="card rows">
        <div><dt>เลขที่คำสั่งซื้อ</dt><dd class="mono">${o.no}</dd></div>
        <div><dt>สถานะ</dt><dd>${badge(o.status)}</dd></div>
        <div><dt>ยอดชำระ</dt><dd class="price">${baht(book(o.bookId).price)}</dd></div>
      </dl>
      <div class="methods">
        <div class="head"><h2>ช่องทางชำระเงิน</h2><span class="hint">ปิดใช้งานในโหมดสาธิต</span></div>
        <label class="method"><input type="radio" disabled> พร้อมเพย์</label>
        <label class="method"><input type="radio" disabled> บัตรเครดิต / เดบิต</label>
        <div class="qr"><span>QR จำลอง · ไม่มี payment gateway จริง</span></div>
      </div>
    </div>
    <div class="bar"><button class="btn">จำลองชำระเงินสำเร็จ</button></div>
  </form>`;

// 05
const success = o => `
  <div class="body center success">
    <div class="check" aria-hidden="true">✓</div>
    <h1>ชำระเงินสำเร็จ</h1>${badge(o.status)}
    <div class="card">
      <span class="muted">เลขที่คำสั่งซื้อ</span>
      <span class="order-no">${o.no}</span>
      <button type="button" class="btn outline sm" data-act="copy" data-no="${o.no}">⧉ คัดลอก</button>
    </div>
    <div class="note">
      <p>ส่งลิงก์ดาวน์โหลดไปที่อีเมลของคุณแล้ว</p>
      <p class="mono">${esc(o.email)}</p>
      <p class="muted">⏱ ลิงก์มีอายุจำกัด (หมดอายุภายใน 24 ชั่วโมง) หากหมดอายุ ให้ขอลิงก์ใหม่จากหน้าติดตามคำสั่งซื้อ</p>
    </div>
    <p class="hint">ไม่พบอีเมล? ตรวจสอบกล่องจดหมายขยะ</p>
  </div>
  <div class="bar">
    <button type="button" class="btn outline" data-act="track" data-no="${o.no}">ติดตามคำสั่งซื้อ</button>
    <a class="btn dashed" href="#/">กลับหน้าร้าน</a>
  </div>`;

// 06-A search / 06-C error
const search = () => `${nav('ติดตามคำสั่งซื้อ', '#/')}
  <form id="track" class="fill guard${track.error ? ' err' : ''}">
    <div class="body">
      ${track.error
        ? `<div class="alert" role="alert"><span>✕</span><div><strong>ไม่พบคำสั่งซื้อ</strong>เลขที่คำสั่งซื้อและอีเมลไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง หรือดูอีเมลยืนยันการสั่งซื้อ</div></div>`
        : `<div class="note row"><span>🔒</span><p class="muted">ต้องกรอกทั้ง <b>เลขที่คำสั่งซื้อ</b> และ <b>อีเมล</b> ให้ตรงกัน เพื่อป้องกันการเข้าถึงข้อมูลของลูกค้าคนอื่น</p></div>`}
      <label><span>เลขที่คำสั่งซื้อ <b class="req">*</b></span><input name="no" required autocapitalize="characters" placeholder="เช่น EB-2026-0042" value="${esc(track.no)}"></label>
      <label><span>อีเมลที่ใช้สั่งซื้อ <b class="req">*</b></span><input name="email" type="email" required autocomplete="email" value="${esc(track.email)}">
        ${track.error ? '<small class="bad">ต้องกรอกทั้งสองช่องให้ตรงกับข้อมูลการสั่งซื้อ</small>' : ''}</label>
      ${track.error
        ? `<div class="note"><strong>ยังหาไม่เจอ?</strong><p class="muted">ระบบไม่บอกว่าช่องไหนผิด เพื่อความปลอดภัยของข้อมูลลูกค้า · ติดต่อร้านค้าได้ที่ลิงก์ด้านล่าง</p><a href="${SHOP.contact}">ติดต่อร้านค้า</a></div>`
        : `<p class="hint">* จำเป็นทั้งสองช่อง ปุ่มค้นหาจะกดได้เมื่อกรอกครบ</p><div class="empty">ยังไม่ได้ค้นหา</div>`}
    </div>
    <div class="bar"><button class="btn">ค้นหา</button></div>
  </form>`;

// 06-B
const result = o => `${nav('ผลการค้นหา', '#/track')}
  <div class="body">
    <div class="card">
      <dl class="rows">
        <div><dt>เลขที่คำสั่งซื้อ</dt><dd class="mono">${o.no}</dd></div>
        <div><dt>หนังสือ</dt><dd>${book(o.bookId).title}</dd></div>
        <div><dt>สถานะ</dt><dd>${badge(o.status)}</dd></div>
      </dl>
      <div class="dl">
        <button type="button" class="btn" data-act="download" ${o.status === 'PAID' ? '' : 'disabled'}>ดาวน์โหลด</button>
        <p class="hint">${o.status === 'PAID' ? 'ลิงก์มีอายุจำกัด · หมดอายุภายใน 24 ชั่วโมง' : 'ดาวน์โหลดได้เมื่อสถานะเปลี่ยนเป็น PAID'}</p>
      </div>
    </div>
  </div>
  <div class="bar"><button type="button" class="btn outline" data-act="reset">ค้นหาใหม่</button></div>`;

function render() {
  const [, page, arg] = location.hash.split('/');
  if (page !== 'track') track.error = false;
  const o = page === 'order' && orders()[arg];
  const found = page === 'track' && arg === 'result' && findOrder(track.no, track.email);
  $app.innerHTML =
    page === 'book' && book(arg) ? detail(book(arg)) :
    page === 'summary' && draft.bookId ? summary(book(draft.bookId)) :
    o ? (o.status === 'PAID' ? success(o) : pay(o)) :
    page === 'track' ? (found ? result(found) : search()) :
    storefront();
  window.scrollTo(0, 0);
}

const actions = {
  buyer(d) { Object.assign(draft, d); location.hash = '#/summary'; },
  confirm() {
    const no = `EB-${new Date().getFullYear()}-${String(Object.keys(orders()).length + 1).padStart(4, '0')}`;
    saveOrder({ no, bookId: draft.bookId, name: draft.name.trim(), email: draft.email.trim(), status: 'PENDING', createdAt: Date.now() });
    draft.bookId = null; // back from payment can't place the same order twice
    location.replace('#/order/' + no);
  },
  pay({ no }) { saveOrder({ ...orders()[no], status: 'PAID', paidAt: Date.now() }); render(); },
  track({ no, email }) {
    Object.assign(track, { no, email, error: !findOrder(no, email) });
    if (!track.error && location.hash !== '#/track/result') location.hash = '#/track/result';
    else render();
  },
};

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { // WebView / non-https fallback
    const t = Object.assign(document.createElement('textarea'), { value: text });
    document.body.append(t); t.select(); document.execCommand('copy'); t.remove();
  }
  toast('คัดลอกแล้ว');
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2000);
}

document.addEventListener('submit', e => {
  e.preventDefault();
  actions[e.target.id](Object.fromEntries(new FormData(e.target)));
});
document.addEventListener('click', e => {
  const { act, no } = e.target.closest('[data-act]')?.dataset || {};
  if (act === 'copy') copy(no);
  if (act === 'track') { const o = orders()[no]; Object.assign(track, { no: o.no, email: o.email }); location.hash = '#/track/result'; }
  if (act === 'reset') { Object.assign(track, { no: '', email: '' }); location.hash = '#/track'; }
  if (act === 'download') toast('เริ่มดาวน์โหลด (จำลอง)'); // ponytail: no real files, wire to a signed URL from the server
});
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
