x-database-url: &database_url postgresql://${POSTGRES_USER:-ebook}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ebook}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ebook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # host-only, for `npm test` in api/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    # one-shot: apply migrations + seed the 3 books (idempotent), then exit
    build:
      context: ./api
      target: migrate
    environment:
      DATABASE_URL: *database_url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    init: true
    environment:
      DATABASE_URL: *database_url
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-E-book Shop <no-reply@example.com>}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://localhost}
    init: true
    environment:
      API_INTERNAL_URL: http://api:4000 # server-side fetches skip the TLS round trip through nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  certs:
    # one-shot: self-signed cert for https://localhost unless real certs are already in nginx/certs
    image: alpine/openssl:3.3.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - '[ -f /certs/fullchain.pem ] || openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj /CN=localhost -addext subjectAltName=DNS:localhost -keyout /certs/privkey.pem -out /certs/fullchain.pem'
    volumes:
      - ./nginx/certs:/certs

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://your-app.vercel.app}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
